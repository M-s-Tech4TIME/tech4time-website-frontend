# Every check this repository has, run on the machine rather than on a promise.
#
# THIS IS THE FRONTEND. The editor's round trips, the sign-in and the browser
# run over the admin are in tech4time-website-backend's workflow of the same name.
# Neither list is the whole suite any more, and neither pretends to be.
#
# The pre-commit list in docs/10-development/testing.md is what a person is
# asked to run. This is the same list run by something that cannot forget, and
# deploy.yml requires it: what gates a merge and what gates a release are the
# same set of checks, deliberately, so that "it passed on my machine" and "it
# is safe to put on the server" stop being two different claims.
name: test

on:
  # dev only. A push to main is a release, and deploy.yml calls this workflow
  # itself — listing main here too would run every check twice for one merge
  # and report the answer in two places.
  push:
    branches: [dev]
  pull_request:
    branches: [main]
  workflow_dispatch:
  # Called by deploy.yml, so a release runs the same checks a merge does
  # rather than a second list that can drift from this one.
  workflow_call:

permissions:
  contents: read

# A second push to the same branch makes the first run's answer irrelevant.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          # check_cache_bust.py compares this commit against origin/main, and a
          # shallow clone has neither the ref nor the history to do it.
          fetch-depth: 0
      - uses: ./.github/actions/php

      # Printed for the record. The VERSION is asserted inside the action above
      # -- it installs the 8.2 the host runs and fails the run on anything else,
      # so the runner can no longer drift ahead of production without saying so.
      - name: versions
        run: |
          python3 -V
          php -v | head -1

      # EVERY CHECK, THEN A VERDICT — not one step per check. A step-per-check
      # job stops at the first failure, so the fifteen checks behind it never
      # run and each fix reveals the next one a round trip at a time. The
      # browser job learned this after test_motion failed on its third check
      # and hid five whole suites; the server job learned it too. This was the
      # last place in this repository that had not.
      #
      # Grouped so the log stays readable, with the failing names repeated at
      # the end where nobody has to scroll for them.
      - name: static checks
        run: |
          set -uo pipefail
          failed=""
          run () {
            name="$1"; shift
            echo "::group::$name"
            if python3 "tools/$name.py" "$@"; then
              echo "-- $name passed"
            else
              echo "-- $name FAILED"
              failed="$failed $name"
            fi
            echo "::endgroup::"
          }

          run check_contrast
          run check_css
          run check_shared_markup
          run check_content_model
          run check_secrets
          run check_docs

          # An icon name the sprite does not carry paints NOTHING, with no error
          # and no console line, so a blank box ships and reads as a design
          # choice. That is how the admin's Settings row and its Overview tile
          # were empty for a release: ADMIN_SECTIONS named 'cog' and the sprite
          # had only 'cogs'.
          run check_icons
          run audit_pages
          run inject_icons --check
          run build_deploy_set --check

          # The hero circuit is generated from the artwork in references/, and
          # this is the half of that which needs no browser: it redraws the
          # template from the committed geometry and refuses if what is on disk
          # differs. Catches a coordinate edited by hand, and a geometry
          # re-resolved and never rebuilt.
          run build_hero_circuit --check

          # Filenames here are not content-hashed and .htaccess caches CSS, JS
          # and fonts for a year, so a changed asset behind an unchanged URL
          # reaches new visitors only. The rule is a version query bumped by
          # hand, this is the mechanism that checks it, and it has caught the
          # miss twice.
          run check_cache_bust

          # The eight files both repositories hold identically, compared against
          # a digest committed HERE. Hygiene, not a guarantee -- the guarantee
          # is CONTRACT_VERSION, checked at run time by api/publish.php against
          # what it was actually sent.
          run check_shared_lib

          # A fact stated in two documents at once -- the offices, the email and
          # the telephone are authored in BOTH the privacy policy and the
          # contact page, on purpose. This asks whether they still agree. It can
          # only see the committed seed: content edited in the admin never
          # passes through git.
          run check_shared_facts
          run check_form_dom

          # And the thing the line above structurally cannot see: whether the
          # OTHER half still holds the same bytes. A per-repo digest passes
          # happily while the two sanitisers differ. This clones the sibling and
          # compares them. It is the only place that check happens anywhere.
          run check_shared_repos --clone

          if [ -n "$failed" ]; then
            echo "::error::failing checks:$failed"
            exit 1
          fi
          echo "all sixteen static checks passed"

  server:
    name: php
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/php

      # These drive a real PHP server, and the private store lands beside the
      # checkout the same way it lands beside the document root on the host.
      - run: php -v | head -1

      # All nine, then a verdict, for the reason the static job above and the
      # browser job below both do it: a step-per-suite stops at the first
      # failure and hides every suite after it.
      - name: php suites
        run: |
          set -uo pipefail
          failed=""
          run () {
            echo "::group::$1"
            if python3 "tools/$1.py"; then
              echo "-- $1 passed"
            else
              echo "-- $1 FAILED"
              failed="$failed $1"
            fi
            echo "::endgroup::"
          }

          run test_svg
          run test_store
          run test_markdown
          run test_contact_handler

          # The one endpoint on this site that writes anything: the happy path,
          # and every way past it that does not involve holding the key.
          run test_publish
          run test_publish_asset

          # The three files that are generated rather than stored: the sitemap,
          # the robots file and the web manifest. Each is served at an address
          # that looks like a static file and none of them is one any more, so a
          # PHP error in any of the three ships as a 500 at a URL no page links
          # to and nobody visits — /sitemap.xml is fetched by Google, not people.
          run test_sitemap

          # The header, footer and dock every page carries. They stopped being
          # markup in seventeen files and became one document rendered by
          # lib/body.php, so a fault in them is a fault on every page at once —
          # including the case a fresh clone is in, where content/chrome.json
          # does not exist yet and the defaults have to carry the whole site.
          run test_chrome

          # The site's identity: the mark, the icons, the colours and where the
          # enquiry form sends. One document that nine places read, which is the
          # point of it -- so the failure this catches is one of the nine
          # drifting away from the other eight. Includes the case a fresh clone
          # is in, where the document is missing and the site still has a logo.
          run test_settings

          # Every renderer that draws an uploaded picture, and the ladder of
          # widths behind it. A width in CONTRACT_IMAGE_SLOTS is measured rather
          # than estimated, and a srcset shipped without a sizes= beside it is a
          # REGRESSION rather than a missing improvement: without it the browser
          # assumes the picture fills the viewport and takes the widest rung on
          # every screen.
          run test_pictures

          if [ -n "$failed" ]; then
            echo "::error::failing suites:$failed"
            exit 1
          fi
          echo "all ten php suites passed"

  browser:
    name: firefox
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/php

      # From Mozilla's tarball rather than apt. On Ubuntu 24.04 `apt install
      # firefox` is a transitional package that pulls the snap, which does not
      # run headless in a runner; and firefox-esr installs a binary called
      # firefox-esr, which every suite below would fail to find and skip over.
      - name: install firefox and geckodriver
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libdbus-glib-1-2 libgtk-3-0t64 libasound2t64
          curl -sSfL -o /tmp/firefox.tar.xz \
            "https://download.mozilla.org/?product=firefox-latest-ssl&os=linux64&lang=en-US"
          sudo tar -xJf /tmp/firefox.tar.xz -C /opt
          sudo ln -sf /opt/firefox/firefox /usr/local/bin/firefox
          GD=0.35.0
          curl -sSfL -o /tmp/gd.tar.gz \
            "https://github.com/mozilla/geckodriver/releases/download/v${GD}/geckodriver-v${GD}-linux64.tar.gz"
          sudo tar -xzf /tmp/gd.tar.gz -C /usr/local/bin geckodriver
          sudo chmod +x /usr/local/bin/geckodriver

      - name: pillow
        run: pip install --quiet Pillow

      # Every browser suite calls shutil.which("firefox") — that exact name —
      # and exits 0 with a notice when it is missing. That is right on a laptop
      # and wrong here, where a failed install would turn seven suites into
      # seven silent passes. So the three names they look for are required to
      # be present before any of them runs.
      - name: the browser is really here
        run: |
          set -euo pipefail
          for n in php firefox geckodriver; do
            command -v "$n" || { echo "::error::$n is not on PATH — the browser suites would have skipped"; exit 1; }
          done
          firefox --version
          geckodriver --version | head -1

      # CHROME, FOR THE ONE CHECK FIREFOX CANNOT MAKE. check_style_budget.py
      # measures style recalculation, which only Chrome's tracing exposes — and
      # it is the only thing in either repository that can see a page holding
      # 60fps while burning a CPU core. That shipped on 2026-09-03 and a person
      # noticed it before any check did.
      #
      # ASSERTED, NOT ASSUMED. The tool prints a notice and exits 0 with no
      # Chrome on PATH, which is right on a laptop and is the silent-pass trap
      # in CI — the same bargain as php-gd, php-xml and qrencode above. This
      # relies on google-chrome-stable being present in the runner image; if
      # that ever stops being true this step fails loudly with a name to fix
      # rather than reporting a measurement it never took.
      - name: chrome, so the style budget is actually measured
        run: |
          set -euo pipefail
          command -v google-chrome-stable || command -v google-chrome || {
            echo "::error::No Chrome on PATH — check_style_budget.py would have skipped,"
            echo "which is a green tick over an unmeasured page. Install it in this job."
            exit 1
          }
          (google-chrome-stable --version || google-chrome --version) | head -1

      # All eight, then a verdict — not eight steps that stop at the first
      # failure. A step-per-suite hides everything behind the earliest
      # problem: test_motion failed on its third check and the five suites
      # after it had never run in CI at all, so each fix would have revealed
      # the next one a three-minute round trip at a time.
      #
      # Grouped so the log is still readable, and the failing names are
      # repeated at the end where nobody has to scroll for them.
      - name: browser suites
        run: |
          set -uo pipefail
          failed=""
          for s in test_nav test_theme test_motion \
                   check_hover check_dark_mode check_responsive check_focus \
                   check_accreditations \
                   check_style_budget; do
            echo "::group::$s"
            if python3 "tools/$s.py"; then
              echo "-- $s passed"
            else
              echo "-- $s FAILED"
              failed="$failed $s"
            fi
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "::error::failing suites:$failed"
            exit 1
          fi
          echo "all eight browser suites passed"

      # These leave processes behind when a step is cancelled, and a runner
      # that hangs on to Firefox never finishes.
      - name: clean up
        if: always()
        run: pkill -f geckodriver || true; pkill -f firefox || true
